name: Windows Build & Release

on:
  # main 分支更新时自动编译，仅上传 Actions Artifact
  push:
    branches:
      - main
    tags:
      - "v*"

  # 支持在 Actions 页面手动编译
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  windows:
    name: Windows x64 (NSIS + portable)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          }

          "version=$version" >> $env:GITHUB_OUTPUT

          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 100 | Set-Content "package.json" -Encoding utf8

          $tauri = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json" -Encoding utf8

          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`"", 1)
          Set-Content "src-tauri/Cargo.toml" $cargo -Encoding utf8

          Write-Host "Building HGhub version $version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Collect installer and portable package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $artifactDir = "artifacts"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null

          $installerDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $installerDir -File -Filter "*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "No NSIS installer found in $installerDir"
          }

          foreach ($installer in $installers) {
            Copy-Item $installer.FullName $artifactDir
          }

          $portableExe = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $portableExe)) {
            $candidates = @(Get-ChildItem "src-tauri/target/release" -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "build-script" })
            if ($candidates.Count -eq 0) {
              throw "No portable executable found in src-tauri/target/release"
            }
            $portableExe = $candidates[0].FullName
          }

          $portableName = "HGhub.exe"
          Copy-Item $portableExe "$artifactDir/$portableName"
          Compress-Archive -Path "$artifactDir/$portableName" -DestinationPath "$artifactDir/HGhub_${version}_x64_portable.zip" -Force
          Remove-Item "$artifactDir/$portableName"

          Get-ChildItem $artifactDir -File | Select-Object Name, Length
          if ((Get-ChildItem $artifactDir -File).Count -lt 2) {
            throw "Expected both installer and portable ZIP artifacts"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows Release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts

      - name: List release files
        run: ls -lh artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
